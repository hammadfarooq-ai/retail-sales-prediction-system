# docker compose up --build
# Prerequisite: run the ML pipeline once (`make pipeline`) so ml/artifacts and data/processed exist;
# they are mounted read-only into the backend, which seeds PostgreSQL on first start.
#
# Database: the backend uses COMPOSE_DATABASE_URL from .env (e.g. your own PostgreSQL "RetailDB" on the
# host, reached via host.docker.internal). If it is not set, start the bundled PostgreSQL instead:
#     docker compose --profile bundled-db up --build
name: retail-sales

services:
  postgres:
    profiles: ["bundled-db"]   # optional: only started with --profile bundled-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-retail_sales}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false        # ignored when the bundled database profile is not enabled
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach a PostgreSQL running on the host (Linux too)
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      # External database (RetailDB) if COMPOSE_DATABASE_URL is set, else the bundled postgres service.
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-retail_sales}}
      MODEL_ARTIFACTS_DIR: /app/ml/artifacts
      PROCESSED_DATA_DIR: /app/data/processed
      HISTORY_DAYS_IN_DB: ${HISTORY_DAYS_IN_DB:-180}
      MAX_FORECAST_HORIZON_DAYS: ${MAX_FORECAST_HORIZON_DAYS:-28}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
      - ./data/processed:/app/data/processed:ro
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      # The very first start seeds PostgreSQL (~2-3 min) and loads the model before serving.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 360s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"

volumes:
  pgdata:
