[project]
name = "retail-sales-prediction-system"
version = "1.0.0"
description = "End-to-end retail sales forecasting: ML pipeline, FastAPI backend, PostgreSQL, React dashboard"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"ml/notebooks/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
explicit_package_bases = true
namespace_packages = true
exclude = ["frontend/", "data/", "\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]
addopts = "-q"
markers = [
  "requires_artifacts: needs trained model artifacts in ml/artifacts",
  "requires_data: needs the raw Kaggle CSVs in ./data",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
