# Render Blueprint: FastAPI backend + PostgreSQL.
# The React frontend is deployed separately on Vercel (see README, "Deploy").
services:
  - type: web
    name: retail-sales-api
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.render
    dockerContext: .
    plan: free            # 512 MB RAM; upgrade to "starter" if the service is OOM-killed
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: retail-sales-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Allow the Vercel deployment(s) of this project to call the API.
      - key: CORS_ORIGIN_REGEX
        value: ^https://retail-sales-prediction[a-z0-9-]*\.vercel\.app$
      - key: CORS_ORIGINS
        value: http://localhost:5173

databases:
  - name: retail-sales-db
    databaseName: retail_sales
    user: retail
    plan: free            # free Render Postgres is time-limited; use a paid plan to keep it
